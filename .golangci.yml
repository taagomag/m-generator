version: "2"

linters:
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G404 # math/rand is intentional: values are synthetic, not security-sensitive
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
