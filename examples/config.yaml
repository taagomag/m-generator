output:
  type: json
  json:
    file: metrics.json

generator:
  rate: 1/s

metrics:
  - name: http_requests_total
    type: counter
    help: Total HTTP requests
    labels:
      - name: method
        values: [GET, POST, PUT, DELETE]
        distribution: [0.6, 0.25, 0.1, 0.05]
    value:
      type: increment
      min: 1
      max: 10
